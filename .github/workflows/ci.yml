name: Verify
on:
  # PR branches are verified by their pull_request run; push covers main only.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # On main, looks for a passing pull request run that already tested this exact
  # tree. Each run's `check` job uploads its build as `dist-<tree>`; a pull request
  # run tests the merge of its head into main, so a squash merge made before main
  # moves on yields the same tree. When one is found, the tests are skipped and
  # `deploy` publishes that run's build; otherwise the full suite runs here. Only
  # runs from this repository count, so a fork cannot supply a build.
  reuse:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
      tree: ${{ steps.find.outputs.tree }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tree=$(gh api "repos/$GH_REPO/commits/$SHA" --jq .commit.tree.sha)
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          runs=$(gh api "repos/$GH_REPO/actions/artifacts?name=dist-$tree&per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | .workflow_run.id')
          for run in $runs; do
            passed=$(gh api "repos/$GH_REPO/actions/runs/$run" --jq 'select(
              .event == "pull_request" and .conclusion == "success" and
              .head_repository.full_name == env.GH_REPO and
              .path == ".github/workflows/ci.yml") | .html_url')
            if [ -n "$passed" ]; then
              echo "Tree $tree passed in $passed; deploying that build."
              echo "run-id=$run" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No passing pull request run tested tree $tree; running the full suite."

  # Format, vet, the native and WASM bridge tests, and the build that `deploy`
  # publishes. The race pass and the browser tests run beside it in their own jobs.
  check:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.run-id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tree: ${{ steps.tree.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: gofmt and vet
        run: |
          files=$(gofmt -l engine cmd)
          if [ -n "$files" ]; then printf 'Run gofmt on:\n%s\n' "$files"; exit 1; fi
          go vet ./...
          GOOS=js GOARCH=wasm go vet ./cmd/wasm
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - id: tree
        run: echo "sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      # Pull request runs upload too, so main can deploy a build that already passed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ steps.tree.outputs.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # The native race pass, split across runners: in one job it has taken over
  # eight minutes, most of them in engine/earth/chance. Each shard runs every
  # nth test by name (scripts/go-race.mjs); together they run every test.
  race:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.run-id == '' }}
    name: go race (${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        total: [3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/go-race.mjs ${{ matrix.shard }}/${{ matrix.total }}

  # The Chromium tests, one runner for the desktop project and one for the
  # phone. Each builds its own copy of the site, which takes seconds, rather
  # than waiting on `check`.
  browser:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.run-id == '' }}
    name: browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, phone]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=${{ matrix.project }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.project }}-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Safari's engine, which every iOS browser also uses.
  webkit:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.run-id == '' }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - run: npm run build
      - run: npx playwright test --project=webkit
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The one required status check. Every test job must pass, except on main when
  # `reuse` found a passing run of this exact tree and the tests were skipped.
  verify:
    needs: [reuse, check, race, browser, webkit]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          REUSED: ${{ needs.reuse.outputs.run-id }}
          RESULTS: ${{ needs.check.result }} ${{ needs.race.result }} ${{ needs.browser.result }} ${{ needs.webkit.result }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success) ;;
              skipped) test -n "$REUSED" || { echo "::error::A test job was skipped."; exit 1; } ;;
              *) echo "::error::A test job finished with: $result"; exit 1 ;;
            esac
          done

  # Publishes the exact build that passed `verify`, from this run or from the pull
  # request run `reuse` found. Hosting is managed in iwvelando/cloud-accounts
  # (sites/three-body.isaacvelando.com). Only this job can get AWS credentials,
  # and the `production` environment only allows main.
  deploy:
    needs: [reuse, check, verify]
    if: >-
      !cancelled() && needs.verify.result == 'success' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://three-body.isaacvelando.com
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      DEPLOY_ROLE_ARN: arn:aws:iam::634753796535:role/three-body-deploy
      BUCKET: three-body-site-634753796535
      DISTRIBUTION_ID: E2CR5ZWSJTMBG7
      SITE_URL: https://three-body.isaacvelando.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ needs.check.outputs.tree || needs.reuse.outputs.tree }}
          path: dist
          run-id: ${{ needs.reuse.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}

      # `sync --delete` below would wipe the site if the build came out empty, and
      # a site without its engine can't run a simulation.
      - name: sanity-check build
        run: |
          for f in index.html 404.html worker.js wasm_exec.js engine.wasm logo.svg og.png apple-touch-icon.png robots.txt sitemap.xml GO-LICENSE THIRD-PARTY-NOTICES.txt; do test -s "dist/$f"; done
          ls dist/assets/*.js dist/assets/*.css
          test "$(stat -c %s dist/engine.wasm)" -gt 1000000

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Fingerprinted assets first, so the new index.html never references a missing
      # file. Old assets are kept for pages that were already open during a deploy.
      # The engine gets its content type explicitly: CloudFront compresses only
      # types it recognises, and streaming compilation needs application/wasm.
      - name: upload
        run: |
          aws s3 sync dist/assets/ "s3://$BUCKET/assets/" \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 cp dist/engine.wasm "s3://$BUCKET/engine.wasm" \
            --content-type application/wasm --cache-control 'public, max-age=300'
          aws s3 sync dist/ "s3://$BUCKET/" --delete \
            --exclude 'assets/*' --exclude 'engine.wasm' \
            --cache-control 'public, max-age=300'

      - name: invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"

      - name: check headers
        run: |
          header() { curl -fsSI "$SITE_URL$1" | tr -d '\r' | grep -i "^$2:" | cut -d' ' -f2-; }
          if [ "$(header / content-security-policy)" != "$(tr -d '\n' < deploy/content-security-policy.txt)" ]; then
            echo "::error::The live CSP differs from deploy/content-security-policy.txt. Update iwvelando/cloud-accounts to match."
            exit 1
          fi
          test "$(header /engine.wasm content-type)" = application/wasm
          curl -fsS "$SITE_URL/" | grep -q '<title>Three-Body Simulations'

  # A real browser against the live site, after the deploy. No AWS credentials.
  smoke:
    needs: deploy
    # The default success() would skip this whenever `reuse` skipped the test jobs.
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium --grep @smoke
        env:
          BASE_URL: https://three-body.isaacvelando.com

  # Runs on main started by a workflow (e.g. Dependabot merges) notify no one, so a
  # failure on main opens an issue, or comments on the one already open.
  alert:
    needs: [verify, deploy, smoke]
    if: failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Production deploy failed
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.sha }}
    steps:
      - run: |
          body="Verify run $RUN_URL failed on main at $SHA. The live site may be stale or broken. Fix forward, or revert the change and let it redeploy."
          open=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"
          else gh issue create --title "$TITLE" --body "$body"; fi
